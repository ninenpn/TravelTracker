<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Tracker</title>
<meta name="theme-color" content="#f3f8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="top-t"><h1 id="tripTitle">Travel Tracker</h1><small id="tripSub"></small></div>
    <button class="me-btn" id="btnMe" aria-label="สลับผู้ใช้"></button>
  </header>
  <div id="error" class="error" hidden></div>
  <main>
    <div id="homeDock" class="dock m">
      <div class="dock-map" id="homeMapHolder">
        <div class="dock-ctl dock-tr"><button id="dockSize" class="dock-btn" aria-label="ขยาย/ย่อแผนที่"></button><button id="dockHide" class="dock-btn" aria-label="ซ่อนแผนที่"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button></div>
        <div class="dock-ctl dock-br"><button id="dockLoc" class="dock-btn" aria-label="ตำแหน่งฉัน"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button></div>
        <div class="dock-ctl dock-bl"><button id="dockFull" class="dock-chip">เปิดแผนที่เต็ม</button></div>
      </div>
      <button id="dockShow" class="dock-show" hidden>🗺 แสดงแผนที่</button>
      <div class="days" id="homeDays"></div>
    </div>
    <section id="tab-plan"></section>
    <section id="tab-money" hidden></section>
    <section id="tab-spots" hidden></section>
    <section id="tab-map" hidden></section>
    <section id="tab-menu" hidden></section>
  </main>
  <nav id="tabs">
    <button data-tab="plan" class="on" aria-label="แผน"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>แผน</span></button>
    <button data-tab="money" aria-label="เงิน"><svg viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg><span>เงิน</span></button>
    <button data-tab="spots" aria-label="สถานที่"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>สถานที่</span></button>
    <button data-tab="map" aria-label="แผนที่"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg><span>แผนที่</span></button>
    <button data-tab="menu" aria-label="เมนู"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>เมนู</span></button>
  </nav>
</div>

<div id="login" class="login">
  <div class="login-in">
    <div class="logo">✈️</div>
    <h1>Travel Tracker</h1>
    <p id="loginSub">กำลังโหลดสมาชิก…</p>
    <div id="loginUsers" class="login-grid"></div>
    <div id="loginPin" hidden></div>
    <button id="loginGuest" class="link" hidden>เข้าแบบไม่ระบุตัวตน</button>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>window.BUILD="__BUILD__"</script>
<script src="config.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
