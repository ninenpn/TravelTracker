<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Tracker</title>
<meta name="theme-color" content="#f3f8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-t"><h1 id="tripTitle">Travel Tracker</h1><small id="tripSub"></small></div>
    <button class="cd-chip" id="btnCd" aria-label="นับถอยหลัง"><span class="cd-l" id="cdL">&nbsp;</span><span class="cd-v" id="cdV">&nbsp;</span></button>
  </header>
  <div id="error" class="error" hidden></div>
  <main>
    <div id="homeDock" class="dock m">
      <button id="dockFull" class="mapcard" aria-label="เปิดแผนที่"><span class="mapcard-i"><i data-ic="map"></i></span><span class="mapcard-t"><b>เปิดแผนที่</b><small>เส้นทาง · ที่เที่ยว · เพื่อน</small></span><span class="mapcard-go"><i data-ic="chev"></i></span></button>
    </div>
    <div class="days daybar" id="homeDays"></div>
    <section id="tab-plan"></section>
    <section id="tab-money" hidden></section>
    <section id="tab-spots" hidden></section>
    <section id="tab-docs" hidden></section>
    <section id="tab-menu" hidden></section>
  </main>
  <nav id="tabs">
    <button data-tab="plan" class="on" aria-label="แผน"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>แผน</span></button>
    <button data-tab="money" aria-label="ค่าใช้จ่าย"><svg viewBox="0 0 24 24"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg><span>ค่าใช้จ่าย</span></button>
    <button data-tab="spots" aria-label="สถานที่"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>สถานที่</span></button>
    <button data-tab="docs" aria-label="เอกสาร"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>เอกสาร</span></button>
    <button data-tab="menu" aria-label="เมนู"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>เมนู</span></button>
  </nav>
</div>

<dialog id="dlg"></dialog>
<div id="mapOv" class="mapov" hidden role="dialog" aria-label="แผนที่เต็มจอ">
  <div class="mapov-bar"><div class="chips" id="ovFilters"></div><button id="ovFilt" class="ov-btn" aria-label="ตัวกรอง"><i data-ic="filter"></i><b class="badge" id="ovBadge" hidden>0</b></button><button id="ovClose" class="ov-btn" aria-label="ปิดแผนที่"><i data-ic="x"></i></button></div>
  <div class="mapov-map" id="ovHolder"><button id="ovLoc" class="ov-btn mapov-loc" aria-label="ไปที่ตำแหน่งฉัน"><i data-ic="locate"></i></button></div>
  <div class="mapov-st" id="ovStatus"></div>
  <div class="ov-card" id="ovCard" hidden role="dialog" aria-label="รายละเอียดสถานที่"></div>
  <div class="ov-sheet" id="ovSheet" hidden role="dialog" aria-label="ตัวกรอง"></div>
</div>
<div id="docOv" class="dov" hidden role="dialog" aria-label="โชว์เอกสาร"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>window.BUILD="__BUILD__"</script>
<script src="config.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
</body>
</html>
